[project]
name = "wascat-backend"
version = "0.1.0"
description = "WASCAT - West African Sky Archive backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }

dependencies = [
    # Web
    "fastapi[standard-no-fastapi-cloud-cli]>=0.121,<1",
    "uvicorn[standard]>=0.38,<1",
    "python-multipart>=0.0.20",
    "orjson>=3.10",
    # Config and validation
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "alembic-postgresql-enum>=1.7,<2",
    # Security
    "pyjwt[crypto]>=2.10,<3",
    "pwdlib[argon2]>=0.2.1,<1",
    # Object storage
    "aioboto3>=14,<16",
    # Imaging and measurement
    "pillow>=11,<13",
    "numpy>=2.1,<3",
    # CLI and logging
    "typer>=0.15,<1",
    "structlog>=24,<27",
]

[project.scripts]
wascat = "wascat.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "import-linter>=2.1",
    "types-aioboto3[s3]>=14",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "httpx>=0.28",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wascat"]

[tool.uv]
package = true
default-groups = ["dev", "test"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
    "ASYNC", # blocking calls inside async def
    "S",     # bandit
    "DTZ",   # naive datetimes
    "N", "TID", "PT", "PLC", "PLE", "PLW",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF012",  # ClassVar annotations on mutable class attrs, noisy with SQLAlchemy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"migrations/**" = ["E", "F401", "N999", "I001"]
"src/wascat/domains/ingest/optics.py" = ["N806"]  # maths reads better with capitals
# The presenter reproduces strings the site renders verbatim, including an
# en dash and a middle dot. RUF001 flags exactly the characters that are the
# point of the module.
"src/wascat/domains/catalog/presenters.py" = ["RUF001"]
"src/wascat/core/jsformat.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["wascat"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = []
warn_unreachable = true
disallow_untyped_decorators = false  # typer and fastapi decorators

[[tool.mypy.overrides]]
module = ["aioboto3.*", "aiobotocore.*", "alembic.*", "alembic_postgresql_enum.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Both scopes must agree: a session-scoped engine created in one event loop
# cannot be awaited from a per-test loop ("attached to a different loop").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "golden: reproduces numbers recorded in seed/catalog.generated.json",
    "contract: replays a response recorded from the pre-migration Next.js API",
    "db: requires a PostgreSQL database",
    "slow: runs over the full frame archive",
]
